<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background room lighting -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Window light gradient -->
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.4" />
    </linearGradient>

    <!-- Desk gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Hair gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1e18" />
      <stop offset="60%" stop-color="#1f140e" />
      <stop offset="100%" stop-color="#120c08" />
    </linearGradient>

    <!-- Shirt gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Laptop screen glow -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Wall & Window -->
  <rect width="600" height="800" fill="url(#bgGrad)" />
  
  <!-- Window frames in background -->
  <rect x="220" y="80" width="340" height="420" fill="url(#windowLight)" rx="6" />
  <line x1="390" y1="80" x2="390" y2="500" stroke="#cbd5e1" stroke-width="6" />
  <line x1="220" y1="280" x2="560" y2="280" stroke="#cbd5e1" stroke-width="6" />

  <!-- Natural ambient window glare -->
  <path d="M 220,80 L 480,80 L 320,500 L 220,500 Z" fill="#ffffff" opacity="0.35" />

  <!-- White Desk Structure -->
  <path d="M 120,520 L 600,520 L 600,800 L 120,800 Z" fill="url(#deskGrad)" />
  <line x1="120" y1="520" x2="600" y2="520" stroke="#94a3b8" stroke-width="2" />
  <!-- Desk Leg -->
  <rect x="280" y="525" width="24" height="275" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
  <rect x="296" y="525" width="8" height="275" fill="#94a3b8" opacity="0.3" />

  <!-- Laptop on Desk -->
  <g filter="url(#softShadow)">
    <!-- Base -->
    <path d="M 230,518 L 410,518 L 425,528 L 215,528 Z" fill="#64748b" />
    <path d="M 215,528 L 425,528 L 420,534 L 220,534 Z" fill="#334155" />
    <!-- Screen Display (Angled) -->
    <path d="M 240,340 L 400,340 L 410,518 L 230,518 Z" fill="#1e293b" />
    <path d="M 246,346 L 394,346 L 404,512 L 236,512 Z" fill="url(#screenGlow)" />
    
    <!-- Code lines / website mockup on laptop screen -->
    <rect x="256" y="360" width="130" height="20" rx="3" fill="#cbd5e1" opacity="0.6" />
    <rect x="256" y="390" width="40" height="35" rx="3" fill="#e2e8f0" stroke="#cbd5e1" />
    <rect x="302" y="390" width="40" height="35" rx="3" fill="#e2e8f0" stroke="#cbd5e1" />
    <rect x="348" y="390" width="38" height="35" rx="3" fill="#e2e8f0" stroke="#cbd5e1" />
    
    <line x1="256" y1="435" x2="386" y2="435" stroke="#94a3b8" stroke-width="2" />
    <line x1="256" y1="445" x2="350" y2="445" stroke="#cbd5e1" stroke-width="2" />
    <line x1="256" y1="455" x2="370" y2="455" stroke="#cbd5e1" stroke-width="2" />
    
    <!-- Apple/Logo dot -->
    <circle cx="320" cy="485" r="4" fill="#64748b" opacity="0.5" />
  </g>

  <!-- Tablet / Notebook on Desk -->
  <rect x="440" y="522" width="70" height="50" rx="4" fill="#0f172a" opacity="0.8" transform="rotate(-8 440 522)" />

  <!-- Person Sitting at Desk (Side / Over-the-shoulder View) -->
  <!-- Legs & Pants -->
  <path d="M 60,650 Q 80,720 120,800 L 0,800 L 0,650 Z" fill="#0f172a" />
  
  <!-- Torso & White Top -->
  <path d="M 0,380 Q 40,370 70,410 Q 110,460 115,580 Q 115,670 75,750 L 0,750 Z" fill="url(#shirtGrad)" filter="url(#softShadow)" />
  <path d="M 50,420 Q 90,460 135,510 Q 185,530 245,525 L 235,545 Q 170,555 115,535 Q 85,490 40,450 Z" fill="url(#shirtGrad)" />

  <!-- Hand on Laptop Keyboard -->
  <path d="M 235,520 Q 255,515 270,522 Q 260,532 235,535 Z" fill="#e0a98b" />

  <!-- Head & Hair -->
  <!-- Neck -->
  <path d="M 40,320 L 70,320 L 70,390 L 35,390 Z" fill="#e0a98b" />
  <!-- Hair covering head and cascading down back -->
  <path d="M 10,180 Q 50,140 100,190 Q 130,240 110,320 Q 95,380 90,490 Q 60,540 40,560 Q 25,480 30,360 Q 0,320 0,230 Z" fill="url(#hairGrad)" filter="url(#softShadow)" />
  <!-- Profile Face Hint -->
  <path d="M 95,240 Q 115,260 105,295 Q 95,315 85,320 Z" fill="#e0a98b" />

  <!-- Ambient Light Reflection -->
  <ellipse cx="70" cy="270" rx="30" ry="60" fill="#54372b" opacity="0.3" />
</svg>
