<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient: Deep slate / midnight tech navy -->
    <linearGradient id="techBaseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e" />
      <stop offset="40%" stop-color="#0f1b2b" />
      <stop offset="75%" stop-color="#091320" />
      <stop offset="100%" stop-color="#050a10" />
    </linearGradient>

    <!-- Circuit Trace Gradient -->
    <linearGradient id="traceCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Chip Node Radial Gradient -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#082f49" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nodeGlowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#0f766e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0" />
    </radialGradient>

    <!-- Bokeh Depth-of-field Blurs -->
    <filter id="circuitBlurLarge" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" />
    </filter>

    <filter id="circuitBlurMedium" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <filter id="circuitBlurSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" />
    </filter>

    <pattern id="circuitGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(56, 189, 248, 0.04)" stroke-width="1"/>
      <circle cx="80" cy="0" r="1.5" fill="rgba(56, 189, 248, 0.12)"/>
      <circle cx="0" cy="80" r="1.5" fill="rgba(56, 189, 248, 0.12)"/>
    </pattern>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1920" height="1080" fill="url(#techBaseGradient)" />

  <!-- Subtle Microchip Grid -->
  <rect width="1920" height="1080" fill="url(#circuitGrid)" />

  <!-- Out-of-focus background circuit traces & motherboard pads -->
  <g filter="url(#circuitBlurLarge)" opacity="0.45">
    <!-- Large microchip IC silhouettes -->
    <rect x="150" y="180" width="340" height="340" rx="20" fill="#1e293b" stroke="#334155" stroke-width="3" />
    <rect x="1350" y="420" width="420" height="420" rx="30" fill="#1e293b" stroke="#0ea5e9" stroke-width="2" />
    <rect x="750" y="650" width="300" height="240" rx="16" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
    
    <!-- Large ambient glow spots -->
    <circle cx="280" cy="320" r="180" fill="url(#nodeGlow)" />
    <circle cx="1560" cy="620" r="220" fill="url(#nodeGlow)" />
    <circle cx="880" cy="740" r="160" fill="url(#nodeGlowCyan)" />
  </g>

  <!-- Mid-plane PCB circuit traces & IC pin connectors -->
  <g filter="url(#circuitBlurMedium)" stroke="url(#traceCyan)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.65">
    <!-- Left circuit lines -->
    <path d="M 80,120 L 220,120 L 320,220 L 320,380 L 450,510 L 620,510" />
    <path d="M 120,60 L 260,200 L 420,200 L 520,300 L 520,440" />
    <path d="M 60,350 L 180,350 L 250,420 L 250,620 L 380,750 L 550,750" />
    <path d="M 180,780 L 340,780 L 440,880 L 620,880" />

    <!-- Center tech traces -->
    <path d="M 680,180 L 820,180 L 920,280 L 1120,280" />
    <path d="M 740,320 L 860,440 L 1050,440 L 1150,540 L 1320,540" />
    <path d="M 780,820 L 920,820 L 1020,720 L 1220,720 L 1320,820" />

    <!-- Right side PCB bus traces -->
    <path d="M 1250,150 L 1400,150 L 1520,270 L 1750,270" />
    <path d="M 1320,300 L 1440,300 L 1560,420 L 1820,420" />
    <path d="M 1180,520 L 1340,680 L 1520,680 L 1640,800 L 1850,800" />
    <path d="M 1420,850 L 1580,850 L 1680,950 L 1880,950" />
    
    <!-- Microchip pin array patterns -->
    <path d="M 1420,460 L 1420,580 M 1450,460 L 1450,580 M 1480,460 L 1480,580 M 1510,460 L 1510,580 M 1540,460 L 1540,580" stroke="#38bdf8" stroke-width="2" opacity="0.5" />
    <path d="M 220,260 L 220,340 M 240,260 L 240,340 M 260,260 L 260,340 M 280,260 L 280,340" stroke="#22d3ee" stroke-width="2" opacity="0.5" />
  </g>

  <!-- Foreground illuminated nodes & tech bokeh dots -->
  <g filter="url(#circuitBlurSoft)">
    <!-- Cyan & Blue Glowing Solder Nodes -->
    <circle cx="320" cy="220" r="7" fill="#38bdf8" />
    <circle cx="450" cy="510" r="8" fill="#22d3ee" />
    <circle cx="620" cy="510" r="6" fill="#67e8f9" />
    <circle cx="250" cy="420" r="7" fill="#38bdf8" />
    <circle cx="380" cy="750" r="8" fill="#2dd4bf" />
    <circle cx="550" cy="750" r="6" fill="#a7f3d0" />
    <circle cx="920" cy="280" r="7" fill="#38bdf8" />
    <circle cx="1120" cy="280" r="6" fill="#7dd3fc" />
    <circle cx="1050" cy="440" r="8" fill="#22d3ee" />
    <circle cx="1320" cy="540" r="7" fill="#38bdf8" />
    <circle cx="1020" cy="720" r="8" fill="#2dd4bf" />
    <circle cx="1220" cy="720" r="6" fill="#5eead4" />
    <circle cx="1520" cy="270" r="8" fill="#38bdf8" />
    <circle cx="1750" cy="270" r="6" fill="#7dd3fc" />
    <circle cx="1560" cy="420" r="9" fill="#22d3ee" />
    <circle cx="1520" cy="680" r="8" fill="#38bdf8" />
    <circle cx="1640" cy="800" r="7" fill="#2dd4bf" />
    
    <!-- Micro SMT components -->
    <rect x="442" y="502" width="16" height="16" rx="3" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="1042" y="432" width="16" height="16" rx="3" fill="#0f766e" stroke="#2dd4bf" stroke-width="1.5" />
    <rect x="1512" y="672" width="16" height="16" rx="3" fill="#0369a1" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Subtle tech bokeh circles mimicking photography depth -->
  <g opacity="0.35">
    <circle cx="480" cy="380" r="35" fill="#38bdf8" filter="url(#circuitBlurMedium)" />
    <circle cx="1280" cy="380" r="45" fill="#0284c7" filter="url(#circuitBlurMedium)" />
    <circle cx="850" cy="520" r="30" fill="#2dd4bf" filter="url(#circuitBlurMedium)" />
    <circle cx="1680" cy="580" r="50" fill="#38bdf8" filter="url(#circuitBlurLarge)" />
    <circle cx="180" cy="680" r="40" fill="#0ea5e9" filter="url(#circuitBlurLarge)" />
  </g>
</svg>
